{% extends "base.html" %}

{% block title %}投稿 - 轻视频{% endblock %}

{% block content %}
<div class="auth-form" style="max-width: 600px;">
    <h2>上传视频</h2>
    <form method="post" enctype="multipart/form-data" onsubmit="return validateUploadForm()">
        <div class="form-group">
            <label for="title">视频标题</label>
            <input type="text" id="title" name="title" required maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="description">视频简介</label>
            <textarea id="description" name="description" rows="4" maxlength="1000"></textarea>
        </div>
        
        <div class="form-group">
            <label for="video">选择视频文件 (支持mp4, webm, avi, mov, flv，最大500MB)</label>
            <input type="file" id="video" name="video" accept="video/*" required>
        </div>
        
        <div class="form-group">
            <label for="cover">选择封面图片 (可选)</label>
            <input type="file" id="cover" name="cover" accept="image/*" onchange="previewCover(this)">
            <img id="cover-preview" style="max-width: 200px; margin-top: 10px; display: none;">
        </div>
        
        <button type="submit" class="btn">发布视频</button>
    </form>
</div>
{% endblock %}
